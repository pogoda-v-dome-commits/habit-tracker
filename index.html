<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер привычек</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Привычки">
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --card-hover: #1d2129;
    --border: #262b35;
    --text: #eef0f3;
    --text-dim: #8a90a0;
    --accent: #6ee7b7;
    --accent-dim: #2c7a5e;
    --danger: #e26d6d;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  .date {
    color: var(--text-dim);
    font-size: 14px;
    text-transform: capitalize;
    margin-bottom: 4px;
  }
  h1 { font-size: 24px; margin: 0 0 14px; }
  .progress-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .progress-top .count { color: var(--accent); font-weight: 600; }
  .bar-bg {
    height: 8px;
    background: #262b35;
    border-radius: 6px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius: 6px;
    transition: width .35s ease;
  }
  .list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .habit {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    transition: background .2s ease, border-color .2s ease;
  }
  .habit.done { border-color: var(--accent-dim); }
  .habit-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .check {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid #3a4150;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s ease;
    padding: 0;
  }
  .check svg { width: 15px; height: 15px; opacity: 0; transition: opacity .15s ease; }
  .habit.done .check {
    background: var(--accent);
    border-color: var(--accent);
  }
  .habit.done .check svg { opacity: 1; }
  .habit.done .check svg path { stroke: #0f1115; }
  .name {
    flex: 1;
    font-size: 15px;
    cursor: pointer;
    user-select: none;
  }
  .habit.done .name {
    color: var(--text-dim);
    text-decoration: line-through;
  }
  .del-btn {
    flex: none;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 6px;
    opacity: .5;
    transition: opacity .15s ease, color .15s ease;
  }
  .del-btn:hover { opacity: 1; color: var(--danger); }
  .note-field {
    margin-top: 10px;
    padding-left: 38px;
  }
  .note-field textarea {
    width: 100%;
    background: #101319;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 8px 10px;
    resize: none;
    min-height: 36px;
  }
  .note-field textarea:focus { outline: 1px solid var(--accent-dim); }
  .add-row {
    display: flex;
    gap: 8px;
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 10px;
  }
  .add-row input[type="text"] {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 14px;
    padding: 6px 8px;
  }
  .add-row input[type="text"]:focus { outline: none; }
  .add-row label {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
    padding: 0 4px;
  }
  .add-btn {
    background: var(--accent);
    color: #0f1115;
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    flex: none;
  }
  .add-btn:disabled { opacity: .4; cursor: default; }
  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 30px 0;
    font-size: 14px;
  }
  .journal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .journal-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .journal-label .emoji { font-size: 16px; }
  .journal textarea {
    width: 100%;
    background: #101319;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    padding: 10px 12px;
    resize: vertical;
    min-height: 80px;
  }
  .journal textarea:focus { outline: 1px solid var(--accent-dim); }
  .journal .hint-small {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .hint {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="date" id="dateLabel"></div>
    <h1>Мои привычки</h1>
  </header>

  <div class="progress-wrap">
    <div class="progress-top">
      <span>Прогресс дня</span>
      <span class="count" id="progressCount">0 / 0</span>
    </div>
    <div class="bar-bg"><div class="bar-fill" id="progressBar" style="width:0%"></div></div>
  </div>

  <div class="list" id="list"></div>

  <div class="journal">
    <div class="journal-label"><span class="emoji">🙏</span> Благодарности</div>
    <textarea id="gratitudeField" placeholder="За что ты сегодня благодарен? Можно писать списком, каждую с новой строки..."></textarea>
    <div class="hint-small">Обнуляется каждый новый день</div>
  </div>

  <div class="journal">
    <div class="journal-label"><span class="emoji">✨</span> Аффирмации / новые убеждения</div>
    <textarea id="affirmationsField" placeholder="Твои утверждения и убеждения на сегодня..."></textarea>
    <div class="hint-small">Обнуляется каждый новый день</div>
  </div>

  <div class="add-row">
    <input type="text" id="newHabitInput" placeholder="Новая привычка..." maxlength="60">
    <label><input type="checkbox" id="newHabitNote"> с заметкой</label>
    <button class="add-btn" id="addBtn">Добавить</button>
  </div>

  <div class="hint">Список привычек сохраняется. Отметки о выполнении обнуляются каждый новый день.</div>
</div>

<script>
// Локальное хранилище на телефоне (вместо облачного window.storage) —
// данные никуда не уходят, живут прямо в браузере устройства.
window.storage = {
  async get(key) {
    const v = localStorage.getItem('ht_' + key);
    if (v === null) throw new Error('not found');
    return { key, value: v, shared: false };
  },
  async set(key, value) {
    localStorage.setItem('ht_' + key, value);
    return { key, value, shared: false };
  },
  async delete(key) {
    localStorage.removeItem('ht_' + key);
    return { key, deleted: true, shared: false };
  }
};

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

const DEFAULT_HABITS = [
  { id: 'h1', name: 'Ранний подъём', note: false },
  { id: 'h2', name: 'Визуализация цели', note: false },
  { id: 'h3', name: 'Дыхательные упражнения', note: false },
  { id: 'h4', name: 'Растяжка', note: false },
  { id: 'h5', name: 'Холодный душ', note: false },
  { id: 'h7', name: 'Что-то новое узнал', note: true },
  { id: 'h8', name: 'Чтение', note: false },
  { id: 'h9', name: 'Физические упражнения', note: false },
];

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function formatDateLabel() {
  const d = new Date();
  return d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
}

let habits = [];
let completions = {}; // { habitId: true/false }
let notes = {};        // { habitId: text }
let gratitude = '';
let affirmations = '';

async function loadHabits() {
  try {
    const res = await window.storage.get('habits-list');
    habits = res ? JSON.parse(res.value) : DEFAULT_HABITS;
  } catch (e) {
    habits = DEFAULT_HABITS;
    try { await window.storage.set('habits-list', JSON.stringify(habits)); } catch(e2) {}
  }
}

async function saveHabits() {
  try { await window.storage.set('habits-list', JSON.stringify(habits)); } catch(e) { console.error(e); }
}

async function loadToday() {
  const key = 'day:' + todayKey();
  try {
    const res = await window.storage.get(key);
    const data = res ? JSON.parse(res.value) : { completions: {}, notes: {}, gratitude: '', affirmations: '' };
    completions = data.completions || {};
    notes = data.notes || {};
    gratitude = data.gratitude || '';
    affirmations = data.affirmations || '';
  } catch (e) {
    completions = {};
    notes = {};
    gratitude = '';
    affirmations = '';
  }
}

async function saveToday() {
  const key = 'day:' + todayKey();
  try {
    await window.storage.set(key, JSON.stringify({ completions, notes, gratitude, affirmations }));
  } catch (e) { console.error(e); }
}

function render() {
  document.getElementById('dateLabel').textContent = formatDateLabel();

  const list = document.getElementById('list');
  list.innerHTML = '';

  if (habits.length === 0) {
    list.innerHTML = '<div class="empty">Пока нет привычек. Добавьте первую ниже 👇</div>';
  }

  habits.forEach(h => {
    const done = !!completions[h.id];
    const item = document.createElement('div');
    item.className = 'habit' + (done ? ' done' : '');

    const row = document.createElement('div');
    row.className = 'habit-row';

    const check = document.createElement('button');
    check.className = 'check';
    check.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#0f1115" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    check.onclick = () => toggleHabit(h.id);

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = h.name;
    name.onclick = () => toggleHabit(h.id);

    const del = document.createElement('button');
    del.className = 'del-btn';
    del.textContent = '✕';
    del.title = 'Удалить привычку';
    del.onclick = () => removeHabit(h.id);

    row.appendChild(check);
    row.appendChild(name);
    row.appendChild(del);
    item.appendChild(row);

    if (h.note) {
      const noteWrap = document.createElement('div');
      noteWrap.className = 'note-field';
      const ta = document.createElement('textarea');
      ta.placeholder = 'Что именно узнал / заметка...';
      ta.value = notes[h.id] || '';
      ta.rows = 1;
      ta.oninput = () => {
        notes[h.id] = ta.value;
        saveToday();
      };
      noteWrap.appendChild(ta);
      item.appendChild(noteWrap);
    }

    list.appendChild(item);
  });

  const total = habits.length;
  const doneCount = habits.filter(h => completions[h.id]).length;
  document.getElementById('progressCount').textContent = doneCount + ' / ' + total;
  document.getElementById('progressBar').style.width = total ? (doneCount / total * 100) + '%' : '0%';

  document.getElementById('gratitudeField').value = gratitude;
  document.getElementById('affirmationsField').value = affirmations;
}

function toggleHabit(id) {
  completions[id] = !completions[id];
  saveToday();
  render();
}

async function removeHabit(id) {
  habits = habits.filter(h => h.id !== id);
  delete completions[id];
  delete notes[id];
  await saveHabits();
  await saveToday();
  render();
}

async function addHabit() {
  const input = document.getElementById('newHabitInput');
  const noteCheckbox = document.getElementById('newHabitNote');
  const name = input.value.trim();
  if (!name) return;
  const id = 'h_' + Date.now();
  habits.push({ id, name, note: noteCheckbox.checked });
  input.value = '';
  noteCheckbox.checked = false;
  await saveHabits();
  render();
}

document.getElementById('gratitudeField').addEventListener('input', (e) => {
  gratitude = e.target.value;
  saveToday();
});
document.getElementById('affirmationsField').addEventListener('input', (e) => {
  affirmations = e.target.value;
  saveToday();
});

document.getElementById('addBtn').onclick = addHabit;
document.getElementById('newHabitInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addHabit();
});

(async function init() {
  await loadHabits();
  await loadToday();
  render();
})();
</script>
</body>
</html>
