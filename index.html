<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Второе Дыхание — трекер привычек</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#12151B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Второе дыхание">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #12151B;
    --ink-2: #1B1F27;
    --ink-3: #242933;
    --hairline: rgba(237,234,227,0.09);
    --hairline-strong: rgba(237,234,227,0.16);
    --text: #EDEAE3;
    --text-dim: #9A968C;
    --text-faint: #66635C;
    --dawn: #D9A441;
    --dawn-dim: rgba(217,164,65,0.14);
    --sage: #7FA88F;
    --sage-dim: rgba(127,168,143,0.16);
    --danger: #C2705A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--ink);
    color: var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:48px 24px 96px;}

  /* ---- header / sunrise ring ---- */
  header{display:flex;align-items:center;gap:24px;margin-bottom:40px;}
  .ring-holder{position:relative;width:88px;height:88px;flex:none;}
  .ring-holder svg{transform:rotate(-90deg);}
  .ring-bg{fill:none;stroke:var(--ink-3);stroke-width:5;}
  .ring-fg{fill:none;stroke:var(--sage);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1);}
  .ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-pct{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:500;color:var(--text);}
  .head-text h1{font-family:'Fraunces',serif;font-weight:500;font-size:26px;margin:0 0 4px;letter-spacing:-0.01em;}
  .head-text .date{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text-dim);text-transform:capitalize;}
  .head-text .sub{font-size:14px;color:var(--text-dim);margin-top:6px;}

  /* ---- list ---- */
  .list{display:flex;flex-direction:column;gap:1px;background:var(--hairline);border-radius:14px;overflow:hidden;border:0.5px solid var(--hairline-strong);}
  .item{background:var(--ink-2);padding:16px 18px;display:flex;align-items:flex-start;gap:14px;transition:background .2s;}
  .item.done{background:var(--ink-2);}
  .check{
    flex:none;width:24px;height:24px;border-radius:7px;
    border:1.5px solid var(--text-faint);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;background:transparent;margin-top:1px;
    transition:all .15s;color:transparent;
  }
  .check svg{width:14px;height:14px;}
  .check:hover{border-color:var(--dawn);}
  .item.done .check{background:var(--sage);border-color:var(--sage);color:var(--ink);}
  .item-body{flex:1;min-width:0;}
  .item-title{font-size:15px;font-weight:500;cursor:pointer;user-select:none;transition:color .15s;}
  .item.done .item-title{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--text-faint);}
  .item-note{
    width:100%;margin-top:8px;background:var(--ink-3);border:0.5px solid var(--hairline-strong);
    border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;
    padding:8px 10px;resize:none;min-height:36px;line-height:1.5;
  }
  .item-note::placeholder{color:var(--text-faint);}
  .item-note:focus{outline:none;border-color:var(--dawn);}
  .remove-btn{
    flex:none;width:24px;height:24px;border:none;background:none;color:var(--text-faint);
    cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;
    opacity:0;transition:opacity .15s,color .15s,background .15s;margin-top:1px;
  }
  .item:hover .remove-btn{opacity:1;}
  .remove-btn:hover{color:var(--danger);background:rgba(194,112,90,0.1);}
  .remove-btn svg{width:15px;height:15px;}

  /* ---- add row ---- */
  .add-row{margin-top:14px;}
  .add-toggle{
    width:100%;background:none;border:1px dashed var(--hairline-strong);border-radius:12px;
    color:var(--text-dim);font-family:'Inter',sans-serif;font-size:14px;padding:14px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;
  }
  .add-toggle:hover{border-color:var(--dawn);color:var(--dawn);}
  .add-form{
    background:var(--ink-2);border:0.5px solid var(--hairline-strong);border-radius:12px;
    padding:16px;display:none;flex-direction:column;gap:12px;
  }
  .add-form.open{display:flex;}
  .add-form input[type=text]{
    background:var(--ink-3);border:0.5px solid var(--hairline-strong);border-radius:8px;
    color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:10px 12px;
  }
  .add-form input[type=text]:focus{outline:none;border-color:var(--dawn);}
  .type-choice{display:flex;gap:8px;}
  .type-opt{
    flex:1;padding:9px;text-align:center;border-radius:8px;border:0.5px solid var(--hairline-strong);
    font-size:13px;color:var(--text-dim);cursor:pointer;transition:all .15s;
  }
  .type-opt.selected{border-color:var(--dawn);color:var(--dawn);background:var(--dawn-dim);}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;}
  .btn{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:9px 16px;
    border-radius:8px;border:0.5px solid var(--hairline-strong);background:none;color:var(--text-dim);cursor:pointer;
  }
  .btn.primary{background:var(--dawn);border-color:var(--dawn);color:var(--ink);}
  .btn:hover{opacity:0.85;}

  .empty{padding:40px 18px;text-align:center;color:var(--text-faint);font-size:14px;}
  .footer-note{margin-top:28px;text-align:center;font-size:12px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;}

  /* ---- journals ---- */
  .journal{margin-top:44px;}
  .journal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .journal-head svg{width:18px;height:18px;color:var(--dawn);flex:none;}
  .journal-head h2{font-family:'Fraunces',serif;font-weight:500;font-size:19px;margin:0;letter-spacing:-0.01em;}
  .journal-sub{font-size:13px;color:var(--text-dim);margin:-8px 0 14px 28px;}
  .journal-form{
    background:var(--ink-2);border:0.5px solid var(--hairline-strong);border-radius:12px;
    padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px;
  }
  .journal-form textarea{
    background:var(--ink-3);border:0.5px solid var(--hairline-strong);border-radius:8px;
    color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:10px 12px;
    resize:none;min-height:56px;line-height:1.5;
  }
  .journal-form textarea::placeholder{color:var(--text-faint);}
  .journal-form textarea:focus{outline:none;border-color:var(--dawn);}
  .journal-form .form-actions{justify-content:flex-end;}
  .journal-entries{display:flex;flex-direction:column;gap:1px;background:var(--hairline);border-radius:14px;overflow:hidden;border:0.5px solid var(--hairline-strong);}
  .journal-entry{background:var(--ink-2);padding:14px 18px;display:flex;gap:14px;align-items:flex-start;}
  .journal-entry .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--sage);margin-top:7px;}
  .journal-entry .content{flex:1;min-width:0;}
  .journal-entry .entry-date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);margin-bottom:4px;}
  .journal-entry .entry-text{font-size:14px;line-height:1.55;white-space:pre-wrap;}
  .journal-entry .remove-btn{opacity:0;}
  .journal-entry:hover .remove-btn{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ring-holder">
      <svg width="88" height="88" viewBox="0 0 88 88">
        <circle class="ring-bg" cx="44" cy="44" r="38"></circle>
        <circle class="ring-fg" id="ringFg" cx="44" cy="44" r="38" stroke-dasharray="238.76" stroke-dashoffset="238.76"></circle>
      </svg>
      <div class="ring-label"><span class="ring-pct" id="ringPct">0%</span></div>
    </div>
    <div class="head-text">
      <h1>Второе дыхание</h1>
      <div class="date" id="dateLabel">—</div>
      <div class="sub" id="progressSub">Пункты появляются заново каждое утро</div>
    </div>
  </header>

  <div class="list" id="list"></div>

  <div class="add-row">
    <button class="add-toggle" id="addToggle">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Добавить пункт
    </button>
    <div class="add-form" id="addForm">
      <input type="text" id="newTitle" placeholder="Например: медитация 10 минут">
      <div class="type-choice">
        <div class="type-opt selected" data-type="check" id="optCheck">Галочка</div>
        <div class="type-opt" data-type="note" id="optNote">Галочка + заметка</div>
      </div>
      <div class="form-actions">
        <button class="btn" id="cancelAdd">Отмена</button>
        <button class="btn primary" id="confirmAdd">Добавить</button>
      </div>
    </div>
  </div>

  <div class="footer-note" id="streakNote"></div>

  <div class="journal">
    <div class="journal-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M17 3H7a2 2 0 0 0-2 2v9a5 5 0 0 0 10 0V5a2 2 0 0 0-2-2z"/></svg>
      <h2>Дневник успеха</h2>
    </div>
    <div class="journal-sub">Что сегодня получилось, чем гордишься, что удалось</div>
    <div class="journal-form">
      <textarea id="successInput" placeholder="Сегодня я…"></textarea>
      <div class="form-actions"><button class="btn primary" id="successAdd">Записать</button></div>
    </div>
    <div class="journal-entries" id="successList"></div>
  </div>

  <div class="journal">
    <div class="journal-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.5.5.9 1.1 1 1.9v.1h6v-.1c.1-.8.5-1.4 1-1.9A6 6 0 0 0 12 3z"/></svg>
      <h2>Дневник идей</h2>
    </div>
    <div class="journal-sub">Ловим идею, пока не забылась — разберём потом</div>
    <div class="journal-form">
      <textarea id="ideaInput" placeholder="Идея…"></textarea>
      <div class="form-actions"><button class="btn primary" id="ideaAdd">Записать</button></div>
    </div>
    <div class="journal-entries" id="ideaList"></div>
  </div>
</div>

<script>
const storage = {
  async get(key){
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v };
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return { key, value };
  }
};

const RING_CIRC = 238.76;
let habits = [];
let today = {};
let dateKey = '';
let newType = 'check';

function fmtDate(d){
  const days = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  return days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()];
}

function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function defaultHabits(){
  return [
    {id:'h1', title:'Ранний подъём', type:'check'},
    {id:'h2', title:'Визуализация цели', type:'check'},
    {id:'h3', title:'Дыхательные упражнения', type:'check'},
    {id:'h4', title:'Растяжка', type:'check'},
    {id:'h5', title:'Холодный душ', type:'check'},
    {id:'h6', title:'Записал благодарности', type:'check'},
    {id:'h7', title:'Узнал что-то новое', type:'note'},
    {id:'h8', title:'Чтение', type:'check'},
    {id:'h9', title:'Тренировка', type:'check'}
  ];
}

async function loadHabits(){
  try{
    const res = await storage.get('habits-list');
    habits = res ? JSON.parse(res.value) : defaultHabits();
    if(!res){ await storage.set('habits-list', JSON.stringify(habits)); }
  }catch(e){
    habits = defaultHabits();
    await storage.set('habits-list', JSON.stringify(habits));
  }
}

async function saveHabits(){
  try{ await storage.set('habits-list', JSON.stringify(habits)); }
  catch(e){ console.error('Не удалось сохранить список привычек', e); }
}

async function loadToday(){
  try{
    const res = await storage.get(dateKey);
    today = res ? JSON.parse(res.value) : {};
  }catch(e){
    today = {};
  }
}

async function saveToday(){
  try{ await storage.set(dateKey, JSON.stringify(today)); }
  catch(e){ console.error('Не удалось сохранить прогресс дня', e); }
}

function isDone(h){
  const v = today[h.id];
  if(h.type === 'note') return typeof v === 'string' && v.trim().length > 0 ? true : (v === true);
  return v === true;
}

function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  if(habits.length === 0){
    list.innerHTML = '<div class="empty">Список пуст. Добавьте первый пункт ниже.</div>';
  }
  habits.forEach(h => {
    const done = isDone(h);
    const item = document.createElement('div');
    item.className = 'item' + (done ? ' done' : '');

    const check = document.createElement('button');
    check.className = 'check';
    check.setAttribute('aria-label', done ? 'Отметить как невыполненное' : 'Отметить как выполненное');
    check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    check.onclick = () => toggle(h);

    const body = document.createElement('div');
    body.className = 'item-body';

    const title = document.createElement('div');
    title.className = 'item-title';
    title.textContent = h.title;
    title.onclick = () => toggle(h);
    body.appendChild(title);

    if(h.type === 'note'){
      const ta = document.createElement('textarea');
      ta.className = 'item-note';
      ta.placeholder = 'Что именно узнал сегодня…';
      ta.value = typeof today[h.id] === 'string' ? today[h.id] : '';
      ta.addEventListener('change', async () => {
        today[h.id] = ta.value;
        await saveToday();
        render();
      });
      body.appendChild(ta);
    }

    const remove = document.createElement('button');
    remove.className = 'remove-btn';
    remove.setAttribute('aria-label', 'Удалить пункт');
    remove.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
    remove.onclick = async () => {
      habits = habits.filter(x => x.id !== h.id);
      delete today[h.id];
      await saveHabits();
      await saveToday();
      render();
    };

    item.appendChild(check);
    item.appendChild(body);
    item.appendChild(remove);
    list.appendChild(item);
  });
  updateProgress();
}

async function toggle(h){
  if(h.type === 'note'){
    today[h.id] = isDone(h) ? '' : (typeof today[h.id]==='string' ? today[h.id] : ' ');
  } else {
    today[h.id] = !isDone(h);
  }
  await saveToday();
  render();
}

function updateProgress(){
  const total = habits.length;
  const done = habits.filter(isDone).length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('ringPct').textContent = pct + '%';
  const offset = RING_CIRC - (RING_CIRC * pct / 100);
  document.getElementById('ringFg').style.strokeDashoffset = offset;
  document.getElementById('progressSub').textContent = total ? `Выполнено ${done} из ${total}` : 'Пункты появляются заново каждое утро';
  document.getElementById('streakNote').textContent = pct === 100 && total > 0 ? 'Все пункты закрыты — с завтрашним утром они появятся заново' : '';
}

function setupAddForm(){
  const toggle = document.getElementById('addToggle');
  const form = document.getElementById('addForm');
  const titleInput = document.getElementById('newTitle');
  const optCheck = document.getElementById('optCheck');
  const optNote = document.getElementById('optNote');
  const cancel = document.getElementById('cancelAdd');
  const confirm = document.getElementById('confirmAdd');

  toggle.onclick = () => {
    form.classList.add('open');
    toggle.style.display = 'none';
    titleInput.focus();
  };
  cancel.onclick = () => {
    form.classList.remove('open');
    toggle.style.display = 'flex';
    titleInput.value = '';
    newType = 'check';
    optCheck.classList.add('selected');
    optNote.classList.remove('selected');
  };
  optCheck.onclick = () => { newType='check'; optCheck.classList.add('selected'); optNote.classList.remove('selected'); };
  optNote.onclick = () => { newType='note'; optNote.classList.add('selected'); optCheck.classList.remove('selected'); };

  confirm.onclick = async () => {
    const title = titleInput.value.trim();
    if(!title){ titleInput.focus(); return; }
    const id = 'h' + Date.now();
    habits.push({id, title, type:newType});
    await saveHabits();
    cancel.onclick();
    render();
  };

  titleInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') confirm.onclick();
  });
}

let journals = { success: [], idea: [] };

async function loadJournal(kind){
  try{
    const res = await storage.get('journal-' + kind);
    journals[kind] = res ? JSON.parse(res.value) : [];
  }catch(e){
    journals[kind] = [];
  }
}

async function saveJournal(kind){
  try{ await storage.set('journal-' + kind, JSON.stringify(journals[kind])); }
  catch(e){ console.error('Не удалось сохранить дневник', e); }
}

function renderJournal(kind){
  const el = document.getElementById(kind === 'success' ? 'successList' : 'ideaList');
  const entries = journals[kind];
  if(entries.length === 0){
    el.innerHTML = '<div class="empty">Записей пока нет.</div>';
    return;
  }
  el.innerHTML = '';
  entries.slice().reverse().forEach(e => {
    const row = document.createElement('div');
    row.className = 'journal-entry';
    const dot = document.createElement('div');
    dot.className = 'dot';
    const content = document.createElement('div');
    content.className = 'content';
    const date = document.createElement('div');
    date.className = 'entry-date';
    date.textContent = e.dateLabel;
    const text = document.createElement('div');
    text.className = 'entry-text';
    text.textContent = e.text;
    content.appendChild(date);
    content.appendChild(text);
    const remove = document.createElement('button');
    remove.className = 'remove-btn';
    remove.setAttribute('aria-label', 'Удалить запись');
    remove.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
    remove.onclick = async () => {
      journals[kind] = journals[kind].filter(x => x.id !== e.id);
      await saveJournal(kind);
      renderJournal(kind);
    };
    row.appendChild(dot);
    row.appendChild(content);
    row.appendChild(remove);
    el.appendChild(row);
  });
}

function setupJournal(kind){
  const inputId = kind === 'success' ? 'successInput' : 'ideaInput';
  const btnId = kind === 'success' ? 'successAdd' : 'ideaAdd';
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  btn.onclick = async () => {
    const text = input.value.trim();
    if(!text){ input.focus(); return; }
    journals[kind].push({ id: kind + Date.now(), text, dateLabel: fmtDate(new Date()) });
    await saveJournal(kind);
    input.value = '';
    renderJournal(kind);
  };
}

async function init(){
  dateKey = todayKey();
  document.getElementById('dateLabel').textContent = fmtDate(new Date());
  await loadHabits();
  await loadToday();
  setupAddForm();
  render();

  await loadJournal('success');
  await loadJournal('idea');
  setupJournal('success');
  setupJournal('idea');
  renderJournal('success');
  renderJournal('idea');
}

init();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(console.error);
  });
}

</script>
</body>
</html>
